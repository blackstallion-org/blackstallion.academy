      - list [ref=f26e392]:
        - listitem [ref=f26e393]:
          - generic [ref=f26e394]: "01"
          - paragraph [ref=f26e395]: For centuries only royal and Rajput warrior families could own these horses. A Marwari, it was said, stood above a prince.
        - listitem [ref=f26e396]:
          - generic [ref=f26e397]: "02"
          - paragraph [ref=f26e398]: The British preferred their Thoroughbreds. Through the colonial years the Marwari went to fewer battles and was bred with less care; by the 1930s the stock was thinning.
        - listitem [ref=f26e399]:
          - generic [ref=f26e400]: "03"
          - paragraph [ref=f26e401]: Marwar's lancers still rode for Sir Pratap Singh in the First World War, near the end of the age of cavalry.
        - listitem [ref=f26e402]:
          - generic [ref=f26e403]: "04"
          - paragraph [ref=f26e404]: Then came independence. The princes gave up their states and, in the land reforms that followed, their estates.
        - listitem [ref=f26e405]:
          - generic [ref=f26e406]: "05"
          - paragraph [ref=f26e407]: The stables had nowhere to go. Thousands of horses were sold as pack animals, castrated or shot. To many, the horse had become a symbol of the old order.
        - listitem [ref=f26e408]:
          - generic [ref=f26e409]: "06"
          - paragraph [ref=f26e410]: Crossed with other breeds, the pure line began to disappear.
