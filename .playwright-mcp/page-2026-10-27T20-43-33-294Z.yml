          - generic [ref=f26e263]:
            - paragraph [ref=f26e264]: A Marwari's ears curve inward until the tips meet, like the arms of a lyre.
            - paragraph [aria-hidden] [ref=f26e265]: They can turn through 180 degrees, and the horse's hearing is famously sharp.
            - paragraph [aria-hidden] [ref=f26e266]: When the blood is mixed, the curve is the first thing to go. Breeders read the ears as a seal of purity.
            - paragraph [aria-hidden] [ref=f26e267]: That curve is our monogram.
