          - heading "Driven into the desert." [level=2] [ref=f26e186]:
            - generic [ref=f26e187]:
              - generic [ref=f26e188]: Driven into
              - generic [ref=f26e190]: the desert.
        - paragraph [ref=f26e192]: Driven from fertile river plains into the arid expanse of the Thar, the horsemen of Marwar survived on terrain, not ideology. Little grew there. Water came by the cupful. The horses that lived were the ones that could march for days, through heat by day and cold by night, on scraps of fodder, and still carry a rider. The desert did not yield to rank, title or rhetoric. It rewarded stamina, efficiency and stillness, and in time it had given the people of Marwar a horse.
