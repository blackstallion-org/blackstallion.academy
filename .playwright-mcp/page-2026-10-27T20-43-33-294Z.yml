            - paragraph [ref=f26e334]: The stallion at the stream
          - paragraph [ref=f26e335]: A blue-grey stallion, wounded in the leg, would not leave the field until his rider turned him, then carried his rider across a stream to safety before he fell. Ballads across Rajasthan tell the story, and the details differ from teller to teller.
        - listitem [ref=f26e336]:
