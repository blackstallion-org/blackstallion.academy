        - paragraph [ref=f26e302]: "In the late sixteenth century the horsemen of Marwar faced the ultimate test of terrain and survival, and fielded a cavalry of more than fifty thousand. They held one belief about their horses: a Marwari leaves the battlefield in only three ways."
        - paragraph [ref=f26e304]: The bards tell of horses rearing to shield a fallen rider, crossing rivers wounded, and leaping walls no horse should clear.
