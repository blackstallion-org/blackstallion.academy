          - heading "Eight hundred years in one bloodline." [level=2] [ref=f26e130]:
            - generic [ref=f26e131]:
              - generic [ref=f26e132]: Eight hundred years
              - generic [ref=f26e134]: in one bloodline.
          - paragraph [ref=f26e136]: Man saw the world from horseback, and the world expanded.
          - paragraph [ref=f26e138]: "For centuries, civilisation was shaped by the partnership between horse and rider, and the world expanded from horseback. The Marwari emerged from a complex historical crucible: native desert stock, infused with influences from Arabian and Central Asian lines, refined through generations of strict selective breeding by the horsemen of Rajasthan. Whatever the exact genetic currents of its origins, the result is an undeniable masterpiece of adaptation. The Thar Desert stripped away weakness; what remained was a sovereign breed unique to Indian soil — compact, fiercely loyal, and structurally engineered for survival, endurance and absolute grace."
        - figure "PLATE IA stallion of Marwar. Placeholder image." [ref=f26e139]:
          - img "A black Marwari stallion traced by a thin line of gold light" [ref=f26e146]
      - generic [ref=f26e148]:
        - paragraph [ref=f26e149]: Reel 01 · The three theories of origin
        - list [ref=f26e150]:
          - listitem [ref=f26e151]:
            - paragraph [ref=f26e152]:
              - generic [ref=f26e153]: The shipwreck
              - generic [ref=f26e154]: Legend
            - paragraph [ref=f26e155]: Oral histories and early records — later referenced in the sixteenth-century imperial chronicle Ain-i-Akbari — suggest the breed's unique characteristics were influenced by Arabian bloodlines introduced to the west coast. An Arab merchant vessel, the accounts say, was wrecked off the coast of Kutch; seven high-quality horses survived, swam ashore, and were bred with indigenous Marwari and Kathiawari mares, introducing the spirited temperament and fine head shape that became hallmarks of the breed.
          - listitem [ref=f26e156]:
            - paragraph [ref=f26e157]:
              - generic [ref=f26e158]: The steppe
              - generic [ref=f26e159]: Historical influence
            - paragraph [ref=f26e160]: "Over several centuries, military campaigns, migrations and trade networks brought Turkoman, Afghan and Central Asian steppe horses — including lines like the Akhal-Teke — into northern and western India. Bred with local mares, these sturdy warhorses infused the native stock with endurance, bone density and a natural capacity to thrive in hostile, arid environments: the raw stamina that desert horsemen needed simply to survive."
          - listitem [ref=f26e161]:
            - paragraph [ref=f26e162]:
              - generic [ref=f26e163]: The native
              - generic [ref=f26e164]: Most accepted
            - paragraph [ref=f26e165]: The most widely accepted view is that the Marwari is fundamentally an indigenous horse of India, shaped by natural selection in the harsh Thar Desert. Genetic and phenotypic studies describe it as a distinct population, though its precise ancestry is not settled. Its lyre-shaped ears, curving inward until the tips touch, are the breed's most recognisable trait. For over eight centuries this rugged native bloodline was carefully preserved by the Rathore horsemen of Marwar to produce a horse that is, at its heart, an unbreakable product of Indian soil.
