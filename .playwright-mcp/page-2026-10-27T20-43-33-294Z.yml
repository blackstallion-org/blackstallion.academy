          - paragraph [ref=f26e368]: Kesar Kalmi, Udal and many more whose names survive only in song.
      - generic [ref=f26e369]:
        - paragraph [ref=f26e370]: Their courage carried riders home alive. The same quality, calm under pressure, is what the academy teaches.
