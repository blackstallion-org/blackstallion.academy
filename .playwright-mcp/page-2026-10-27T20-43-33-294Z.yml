            - paragraph [ref=f26e345]: The leap from the wall
          - paragraph [ref=f26e346]: In one told story, a horse carried its rider up onto a fortress rampart and leapt from the wall to save him. The horse did not survive the fall. Folklore, not record.
        - listitem [ref=f26e347]:
