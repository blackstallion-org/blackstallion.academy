          - listitem [ref=f26e445]:
            - paragraph [ref=f26e446]: Today
            - paragraph [ref=f26e447]: The breed is no longer at risk, working in endurance, tent pegging, weddings and festivals.
        - generic [ref=f26e448]:
          - paragraph [ref=f26e449]: As told in Marwar
          - paragraph [ref=f26e450]: The stallion that stayed
          - paragraph [ref=f26e451]: "When Maharaja Gaj Singh II visited the thikana of Badgaon to choose a colt sired by its famous stallion Vangalia, he asked to see the sire himself. The thakur, afraid of losing his best horse, led Vangalia out. The Maharaja admired him and left him where he stood: the stallion served the breed best where the mares of south Marwar could reach him. He chose a colt and rode home."
