          - paragraph [ref=f26e357]: Remembered in ballad as the war horse of a Marwar general who guarded a young heir through years of danger.
        - listitem [ref=f26e358]:
          - img "A dappled grey Marwari stallion with a silver bridle by lantern light" [ref=f26e364]
          - generic [ref=f26e365]:
            - paragraph [ref=f26e366]: The ballads
