      - generic [ref=f25e405]:
        - paragraph [ref=f25e406]: BSAH ARCHIVAL FOLIO · CHAPTER VI
        - heading "The Living Bloodline that Never Left the Field" [level=3] [ref=f25e407]
        - generic [ref=f25e408]:
          - paragraph [ref=f25e409]: For over eight hundred years, the desert clans of Marwar bred horses not for docile surrender, but for absolute fidelity in the chaos of battle. Their inward-curving lyre ears swivel 180 degrees to intercept the rider’s lowest whisper over galloping hooves and roaring dust storms.
          - paragraph [ref=f25e410]: Every stallion housed at the Black Stallion Academy is microchipped under ISO 11784/11785 standards, undergoes pre-dawn pulse and tendon inspections, and rests in lantern-lit stalls with round-the-clock parent telemetry. When a cadet mounts Chetak IX or Veer, they are not riding livestock; they are communing with eight centuries of living Indian history.
          - paragraph [ref=f25e411]: The transition from squiredom to Sovereign Lancer demands that every cadet master the distinct personality of multiple steeds. From the measured, steady breathing of Chetak IX to the lightning sprint of Veer under the lowered tent-pegging lance, the studbook records each cadet’s ascent into sovereign command.
