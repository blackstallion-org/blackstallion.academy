          - paragraph [ref=f1e264]: No sessions yet. Record from the camera or upload a video and the session appears here with its recording, data and report.
      - region [ref=f1e265]:
        - generic [ref=f1e266]:
          - heading "How it works" [level=2] [ref=f1e267]
          - paragraph [ref=f1e268]: "A small detector (YOLOX-Nano, trained on everyday photographs) finds horses in each frame. A pose model (RTMPose-m, trained on the AP-10K animal data set) then places 17 points inside the box: eyes, nose, neck, root of tail, and for each leg the shoulder or hip, elbow or knee and paw. Both run in your browser with LiteRT.js."
        - generic [ref=f1e269]:
          - heading "What it can and cannot do" [level=2] [ref=f1e270]
          - paragraph [ref=f1e271]: Gait is read from how each paw moves along the body over about four seconds, so it needs a steady side or three-quarter view. A horse seen head-on, far away, or hidden by a rider or rail will track badly or not at all, and the page says so rather than guessing. The points are generic animal landmarks, not hoof, fetlock and hock markers.
        - generic [ref=f1e272]:
          - heading "Your recordings" [level=2] [ref=f1e273]
          - paragraph [ref=f1e274]:
            - text: Sessions are kept in this browser. Export them as CSV, JSON or a PDF report, or sign in and save them to your private account space. Only record people and horses you have permission to record.
            - link "Privacy notice" [ref=f1e275] [cursor=pointer]:
              - /url: /privacy
            - text: .
