# BSAH website CI: lint, typecheck, unit/server tests, production build, dependency audit, database tests (website
# schema, a replica of the live operations schema, and the backup/restore rehearsal) on a throwaway Postgres 16, and
# browser smoke tests (scripts/e2e-smoke.mjs) against a production build.
# Runs on Linux with no production secrets. Supabase/webhook/Turnstile variables are deliberately empty so every
# test exercises the "not configured" paths; no external system is contacted.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SUPABASE_URL: ""
      SUPABASE_PUBLISHABLE_KEY: ""
      LEAD_WEBHOOK_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit (security audit F-14)
        with:
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, pinned by commit
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and server tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency audit (production, high and above)
        run: npm audit --omit=dev --audit-level=high

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit (security audit F-14)
        with:
          lfs: false
      - name: Postgres 16 binaries
        run: test -x /usr/lib/postgresql/16/bin/initdb || (sudo apt-get update && sudo apt-get install -y postgresql-16)
      - name: Website schema tests (supabase/migrations)
        run: bash supabase/tests/run.sh
      - name: Live operations replica tests (supabase/live)
        run: bash supabase/live/tests/run.sh
      - name: Backup and restore rehearsal (supabase/live; the procedure in docs/DEPLOYMENT_RUNBOOK.md section 8)
        run: bash supabase/live/tests/backup_restore_rehearsal.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SUPABASE_URL: ""
      SUPABASE_PUBLISHABLE_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit (security audit F-14)
        with:
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, pinned by commit
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Playwright (installed outside the project; not a project dependency)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Browser smoke tests (synthetic data, loopback lead receiver)
        run: npm run test:e2e
        env:
          BSAH_PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, pinned by commit
        with:
          name: e2e-results
          path: output/e2e/
          retention-days: 7
